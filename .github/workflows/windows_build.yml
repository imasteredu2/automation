name: Build Windows Executable

on:
  push:
    tags:
      - "v*"          # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger from the GitHub UI

permissions:
  contents: write     # Needed to create a GitHub Release

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller automation.spec --noconfirm

      - name: Zip the dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\AutomationBot -DestinationPath AutomationBot-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutomationBot-Windows
          path: AutomationBot-Windows.zip
          retention-days: 30

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutomationBot-Windows.zip
          generate_release_notes: true
